spring.application.name=springly

# ==========================================
# 1. CONEXÃO COM O BANCO (DATASOURCE H2)
# ==========================================
# Banco em memória chamado "testdb"
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================
# 2. COMPORTAMENTO DO JPA / HIBERNATE
# ==========================================
# create-drop: Cria as tabelas toda vez que o app liga e apaga quando desliga
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true